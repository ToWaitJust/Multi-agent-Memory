<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRTP · 图拓扑视图</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="topbar">
  <a class="navlink" href="/">控制台</a>
  <a class="navlink" href="/canvas">会话画布</a>
  <a class="navlink on" href="/graph">图拓扑</a>
  <h1>图拓扑视图</h1>
  <span class="spacer"></span>
  <div class="toolbar">
    <div class="field">
      <input id="q" placeholder="输入查询，点节点后计算选源" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="saBtn">计算选源</button>
    <div class="seg" role="group" aria-label="布局">
      <button data-layout="breadthfirst" class="on">分层</button>
      <button data-layout="circle">环形</button>
      <button data-layout="grid">网格</button>
    </div>
    <button class="btn btn-ghost" id="fitBtn">适应窗口</button>
  </div>
</header>

<div class="split">
  <div class="canvas-wrap">
    <div id="cy"></div>

    <div class="legend">
      <div><i class="sw" style="background:#3b82f6"></i>depends_on 依赖</div>
      <div><i class="sw" style="background:#0f9d76"></i>derives_from 派生</div>
      <div><i class="sw" style="background:#e08a3c"></i>references 引用</div>
      <div><i class="sw" style="background:#9aa9a3"></i>similar_to 相近</div>
      <div style="margin-top:4px;color:#93a69d">边宽 = 强度 · 虚线 = 成环被降级</div>
    </div>

    <div class="float-tip" id="ftip">载入中…</div>
  </div>

  <aside class="side" id="side"></aside>
</div>

<div id="tip"></div>
<div id="flash" style="position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:99;
  background:#152b23;color:#fff;font-size:12.5px;padding:9px 16px;border-radius:10px;
  box-shadow:0 10px 28px rgba(16,42,33,.25);opacity:0;transition:opacity .25s;pointer-events:none"></div>

<script src="/static/vendor/cytoscape.min.js"></script>
<script src="/static/graph.js"></script>
</body>
</html>
