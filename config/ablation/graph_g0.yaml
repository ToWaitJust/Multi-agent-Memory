# graph_g0.yaml —— G0 · 邻域全量（下界：有图但完全不调度）
# 五组共用的固定量：graph.enabled=true / depth=1 / retriever=vector / quota_lambda=0.7
retriever_impl: retriever.vector
attention_impl: attention.noop        # 无四维打分
weight_impl:    weight.uniform        # 无混合权重
selector_impl:  selector.topk         # 固定 top_k（非阈值自适应）
reward_impl:    reward.none
conditioning_dims: []
top_k: 5
graph:
  enabled: true
  source_mode: auto
  depth: 1
  source_topk: 0                      # 0 = 不裁剪，邻域全量
  quota_mode: none                    # 不做源配额
  quota_lambda: 0.7
# threshold=0.0（= 纯自适应阈值，不再加固定下界）——诊断发现：
#   selector.full 的固定下界 0.6 在四维几何下不可达：首次调度时 frequency 恒为 0
#   （access_count=0 → 1-exp(0)=0），time 随记忆年龄衰减，semantic 受余弦上限制约，
#   实测 final 落在 0.43~0.59 → 阈值 0.6 会把全部候选判为丢弃（kept=0）。
#   置 0.0 表示完全交给自适应规则 max(threshold, mean-0.5*std)，无魔法数字。
#   该设置对 G2/G3/G4 同等生效，不影响组间对比；详见 docs/待审交付包_20260922.md D-015 D4。
graph_provenance: "由 analysis/run_graph_ablation.py 从 data/graph_dataset.jsonl 固定图结构注入"
