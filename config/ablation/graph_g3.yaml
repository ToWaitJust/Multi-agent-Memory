# 归因修正（D-023）：五组统一 selector.topk + 固定 K=8。
#   原因：原设计里 G0/G1 用 selector.topk、G2-G4 用 selector.full（自适应阈值），
#   kept 条数本身成了主导变量（实测 G1 kept=4.38 vs G4 kept=3.81），
#   与'排序质量'混在一起无法归因。固定 K 后 recall 只反映'8 条里命中多少相关'。
# graph_g3.yaml —— G3 · 多源 + 四维打分 + 均匀配额（剥离边强度配额这一层）
retriever_impl: retriever.vector
attention_impl: attention.full
weight_impl:    weight.full
selector_impl:  selector.topk
embedding_impl: embed.dashscope
model_impl:     model.dashscope   # LLM 先验后端（无 DEEPSEEK_API_KEY，改用 qwen-plus）
reward_impl:    reward.explicit
conditioning_dims: [semantic, task]
top_k: 8                              # 归因修正：五组统一固定 K
threshold: 0.0
graph:
  enabled: true
  source_mode: auto
  depth: 1
  source_topk: 3
  quota_mode: uniform                 # 与 G4 唯一差异：配额是否按边强度
  quota_lambda: 0.7
# threshold=0.0（= 纯自适应阈值，不再加固定下界）——诊断发现：
#   selector.full 的固定下界 0.6 在四维几何下不可达：首次调度时 frequency 恒为 0
#   （access_count=0 → 1-exp(0)=0），time 随记忆年龄衰减，semantic 受余弦上限制约，
#   实测 final 落在 0.43~0.59 → 阈值 0.6 会把全部候选判为丢弃（kept=0）。
#   置 0.0 表示完全交给自适应规则 max(threshold, mean-0.5*std)，无魔法数字。
#   该设置对 G2/G3/G4 同等生效，不影响组间对比；详见 docs/待审交付包_20260922.md D-015 D4。
# 完整方法显式启用 LLM 先验（default_tier=full）。
# 代价已实测：p90 约 1.1~1.6s，**超出 NFR-1(<1s)** —— 这是 LLM 先验的真实成本，
# 由均衡档 B 系列证明：跳过先验（fast）可把 p90 降到 ~2ms 而效果仅损失 1.42pt。
# 线上/演示默认档已改为 fast（见 config/srtp.yaml 与 BudgetConfig）。
budget:
  default_tier: full
  adaptive: false
graph_provenance: "由 analysis/run_graph_ablation.py 从 data/graph_dataset.jsonl 固定图结构注入"
